services:
  - type: web
    name: bhoomsetu-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
